# Cutting a release
#
#   npm version patch   # bumps package.json and tags v<version>
#   git push --follow-tags
#
# The tag is what starts this. It builds both halves of the extension and
# attaches them to a GitHub release; Greasy Fork then pulls the userscript from
# the release itself (see below).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The tag and package.json are the same version by construction when the
      # tag comes from `npm version`, but a hand-made tag can disagree -- and a
      # release whose asset carries a different @version than its tag is the
      # kind of thing that is only noticed once Tampermonkey refuses the update.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || {
            echo "tag $tag != package.json $pkg"; exit 1;
          }

      # The committed artefact and the build have to be the same file. They
      # are produced together by npm's `version` hook, so they can only differ
      # if someone edited one by hand or committed without rebuilding -- in
      # which case Greasy Fork would publish the stale one, since it reads the
      # committed file and not the release asset.
      - name: Check the committed artefact matches the build
        run: |
          diff pack-ship-extended.user.js dist/pack-ship-extended.user.js
          diff pack-ship-extended.user.css dist/pack-ship-extended.user.css

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pack-ship-extended.user.js
            dist/pack-ship-extended.user.css
          generate_release_notes: true

      # Greasy Fork syncs when it receives a GitHub webhook delivery, and the
      # delivery has to come from here rather than from a webhook on the
      # repository: a push webhook fires when the tag lands, some twenty-five
      # seconds before this job has published the release it would go looking
      # for. Sending it last removes that race.
      #
      # Shaped against their source (app/controllers/concerns/webhooks.rb and
      # lib/github.rb), because none of this is in their help pages:
      #
      #   - the signature is HMAC-SHA1 in X-Hub-Signature, not the SHA-256
      #     header GitHub also sends -- a mismatch is an empty-bodied 403;
      #   - a `releases/latest/download/...` sync URL is only recognised on a
      #     release event, and only with action "published";
      #   - the file it then reads is the bare filename at the repository root,
      #     at the release's tag. Hence the committed artefacts above.
      - name: Tell Greasy Fork to sync
        env:
          WEBHOOK_URL: ${{ vars.GREASYFORK_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.GREASYFORK_WEBHOOK }}
        run: |
          # The release name becomes the changelog entry on Greasy Fork.
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            --arg branch "${{ github.event.repository.default_branch }}" \
            '{action: "published", release: {name: $tag, tag_name: $tag}, repository: {html_url: $url, clone_url: $clone, default_branch: $branch}}' > payload.json

          # Signed over the exact bytes sent, so the file is what gets hashed
          # and the same file is what gets posted.
          signature="$(openssl dgst -sha1 -hmac "$WEBHOOK_SECRET" -hex < payload.json | awk '{print $NF}')"

          code="$(curl -sS -o response.txt -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: release' \
            -H "X-GitHub-Delivery: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -H "X-Hub-Signature: sha1=$signature" \
            --data-binary @payload.json)"

          # The body lists updated_scripts and update_failed_scripts, or says
          # why it matched nothing. That is the only report of whether this
          # worked, so it goes into the log either way.
          echo "Greasy Fork answered $code:"
          cat response.txt
          echo

          # The release is already published by this point, so a failure here
          # costs only the sync -- but a sync that quietly does nothing is the
          # exact thing that went unnoticed before, so it is loud now.
          test "$code" -lt 400
